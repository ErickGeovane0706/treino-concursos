spring.application.name=treino-concursos

# Carrega as variaveis do backend/.env, se existir (modelo em backend/.env.example).
# Nenhuma senha tem valor padrao aqui: sem o .env a aplicacao nao conecta.
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/treino_concursos}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Horario de Brasilia em toda conexao (doc/banco-de-dados.md): o DEFAULT now()
# das tabelas e o LocalDateTime da aplicacao ficam no mesmo fuso, seja qual
# for o fuso do servidor do banco. Ajusta tambem random_page_cost para SSD e
# dimensiona o pool HikariCP + cache de prepared statements (RNF03, issue #16).
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Sao_Paulo'; SET random_page_cost = 1.1
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.prepareThreshold=3
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=256
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5

# JPA / Hibernate: o schema e controlado so pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor e compressao HTTP (RNF03)
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml

# Configuracoes do proprio site (lidas nas proximas issues)
app.site-url=${SITE_URL:http://localhost:8080}
app.ads.enabled=${ADS_ENABLED:false}
app.ads.publisher-id=${ADSENSE_PUBLISHER_ID:}
app.ads.slot-questao=${ADSENSE_SLOT_QUESTAO:}
app.ads.slot-lateral=${ADSENSE_SLOT_LATERAL:}
app.vite-dev-server=${VITE_DEV_SERVER:}

# Paginas institucionais (RF18): contato por e-mail, sem formulario (RN4)
app.contato.email=${CONTATO_EMAIL:}
app.contato.responsavel=${CONTATO_RESPONSAVEL:}

# Sessao do painel (RNF01): expira apos 8 horas sem uso. Em producao o cookie
# tambem e Secure (application-prod.properties).
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Primeiro administrador (RF01 RN5), so quando a tabela usuarios esta vazia
app.admin-inicial.email=${ADMIN_INICIAL_EMAIL:}
app.admin-inicial.senha=${ADMIN_INICIAL_SENHA:}

# Paginas do painel no formato { content, page } (doc/api.md, secao 8)
spring.data.web.pageable.serialization-mode=via-dto
