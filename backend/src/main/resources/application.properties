spring.application.name=treino-concursos

# Carrega as variaveis do backend/.env, se existir (modelo em backend/.env.example).
# Nenhuma senha tem valor padrao aqui: sem o .env a aplicacao nao conecta.
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/treino_concursos}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate: o schema e controlado so pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# Configuracoes do proprio site (lidas nas proximas issues)
app.site-url=${SITE_URL:http://localhost:8080}
app.ads.enabled=${ADS_ENABLED:false}
app.vite-dev-server=${VITE_DEV_SERVER:}
