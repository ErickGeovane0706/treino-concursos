# Ambiente dos testes de ponta a ponta (Playwright, RF12/#12).
# Sobe a imagem de producao com ADS_ENABLED=true e sem ID de publisher: os blocos de
# anuncio (com altura reservada e rotulo) aparecem no HTML, e os testes bloqueiam as
# requisicoes ao Google, entao nenhum anuncio real e carregado. Valores so de teste.
#
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   cd frontend && npm run e2e
#   docker compose -f docker-compose.e2e.yml down -v

name: treino-concursos-e2e

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: treino_e2e
      POSTGRES_USER: treino
      POSTGRES_PASSWORD: e2e-local
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treino -d treino_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      # Sem o perfil prod: o cookie de sessao precisa funcionar em http para a preparacao dos dados
      SPRING_PROFILES_ACTIVE: e2e
      DB_URL: jdbc:postgresql://db:5432/treino_e2e
      DB_USERNAME: treino
      DB_PASSWORD: e2e-local
      SITE_URL: http://127.0.0.1:18081
      CONTATO_EMAIL: e2e@exemplo.invalid
      CONTATO_RESPONSAVEL: Testes E2E
      ADMIN_INICIAL_EMAIL: e2e-admin@exemplo.invalid
      ADMIN_INICIAL_SENHA: senha-e2e-local-123
      ADS_ENABLED: "true"
      VITE_DEV_SERVER: ""
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/sobre || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
