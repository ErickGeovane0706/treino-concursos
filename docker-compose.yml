# Treino de Concursos - infraestrutura de DESENVOLVIMENTO: so o PostgreSQL.
# Backend (IntelliJ) e frontend (Vite) rodam fora do Docker, com hot reload.
#
#   docker compose up -d       sobe o banco
#   docker compose ps          estado (deve aparecer "healthy")
#   docker compose logs -f db  logs
#   docker compose stop        para, mantendo os dados
#   docker compose down -v     remove o container E APAGA os dados
#
# Os valores vem do .env da raiz (modelo em .env.example). A senha NAO tem
# valor padrao: sem ela o compose se recusa a subir. O repositorio e publico.

# Nome fixo: nao depende do nome da pasta (volume e container sempre iguais).
name: treino-concursos

services:
  db:
    image: postgres:17-alpine
    container_name: treino-concursos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-treino_concursos}
      POSTGRES_USER: ${DB_USERNAME:-treino}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env da raiz (copie de .env.example)}
    # So na maquina local: nao expoe o banco para a rede.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
